syntax = "proto3";

option csharp_namespace = "LibraryGrpcService";

package library;

// 图书服务
service BookService {
  // 获取所有图书（可按分类过滤）
  rpc GetBooks (GetBooksRequest) returns (GetBooksResponse);
  // 根据ID获取单本图书
  rpc GetBook (GetBookRequest) returns (BookMessage);
  // 添加图书
  rpc AddBook (AddBookRequest) returns (BookMessage);
  // 借阅图书
  rpc BorrowBook (BorrowBookRequest) returns (BookMessage);
  // 归还图书
  rpc ReturnBook (ReturnBookRequest) returns (BookMessage);
  // 删除图书
  rpc DeleteBook (DeleteBookRequest) returns (DeleteBookResponse);
}

message BookMessage {
  int32 id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
  string category = 5;
  bool isBorrowed = 6;
  string borrower = 7;
  string borrowDate = 8; // ISO 8601 格式
}

message GetBooksRequest {
  string category = 1; // 传 "全部" 或空表示获取所有
}

message GetBooksResponse {
  repeated BookMessage books = 1;
}

message GetBookRequest {
  int32 id = 1;
}

message AddBookRequest {
  string title = 1;
  string author = 2;
  string isbn = 3;
  string category = 4;
}

message BorrowBookRequest {
  int32 bookId = 1;
  string borrower = 2;
}

message ReturnBookRequest {
  int32 bookId = 1;
}

message DeleteBookRequest {
  int32 id = 1;
}

message DeleteBookResponse {
  bool success = 1;
}